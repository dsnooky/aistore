<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affiliate Command Center</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#101218;--muted:#707683;--line:#e6e8ed;--dark:#0b0d12;--accent:#7c5cff;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.shell{max-width:1320px;margin:auto;padding:22px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:950;letter-spacing:-.6px;margin-right:auto}.mark{width:38px;height:38px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center}.topbtn{border:1px solid var(--line);background:#fff;color:#222;padding:10px 13px;border-radius:11px;font-weight:800;cursor:pointer}.topbtn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px}.stat span{font-size:11px;color:var(--muted);font-weight:750}.stat b{display:block;font-size:26px;margin-top:5px;letter-spacing:-1px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden}.tabs{display:flex;gap:7px;padding:12px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;border-radius:10px;font-weight:850;color:var(--muted);white-space:nowrap;cursor:pointer}.tab.active{background:#111;color:#fff}.content{padding:18px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1;max-width:360px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:0}.toolbar input:focus{border-color:#c9c0ff;box-shadow:0 0 0 4px #7c5cff16}.btn{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:12px 10px;border-bottom:1px solid #eef0f3;text-align:left;font-size:13px}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#7c8290;background:#fafbfc}tr:last-child td{border-bottom:0}.product-cell{display:flex;gap:10px;align-items:center}.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#f0f1f4}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f1f2f5;font-size:10px;font-weight:850}.ok{background:#eaf8ef;color:#14733c}.notice{padding:13px;border-radius:13px;background:#f7f7fa;border:1px solid var(--line);color:#5e6470;font-size:12px}.queue{display:grid;gap:9px}.item{padding:14px;border:1px solid var(--line);border-radius:14px}.item-head{display:flex;justify-content:space-between;gap:10px}.item b{font-size:13px}.muted{color:var(--muted)}pre{white-space:pre-wrap;background:#0b0d12;color:#e8eaf0;padding:16px;border-radius:14px;font-size:12px;overflow:auto}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.box{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.modal-head{display:flex;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#727885;font-weight:800}.form input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:9px;outline:0}.form input:focus{border-color:#c9c0ff}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.shell{padding:14px}.brand span:last-child{display:none}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:21px}.content{padding:12px}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none;width:100%}}
</style>
</head>
<body>
<div class="shell">
<header><a class="brand" href="index.html"><span class="mark">M</span><span>Affiliate Command Center</span></a><a href="index.html"><button class="topbtn">Store ↗</button></a><button class="topbtn primary" onclick="openP()">+ Product</button></header>
<div id="stats" class="stats"></div>
<section class="panel"><div class="tabs">
<button class="tab active" data-tab="products" onclick="tab('products')">Products</button>
<button class="tab" data-tab="content" onclick="tab('content')">Content Queue</button>
<button class="tab" data-tab="campaign" onclick="tab('campaign')">Campaigns</button>
<button class="tab" data-tab="ai" onclick="tab('ai')">AI Studio</button>
</div><div id="main" class="content"></div></section>
</div>

<div class="modal" id="modal"><div class="box"><div class="modal-head"><h2 id="mt">Product</h2></div><div id="form" class="form"></div><div class="modal-actions"><button class="btn light" onclick="closeM()">Cancel</button><button class="btn" onclick="saveP()">Save Product</button></div></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzAn3ApkGGW4RuZBpJUxIFe2ytORVwUIgUVvIUaG3X7LXFx-ttprdUQq-Gx_bWXwT3g/exec";
let d={products:[],content:[],campaigns:[]};
const $=x=>document.querySelector(x);
const fields=["Product_ID","Product_Name","Slug","Category","Price","Old_Price","Discount","Currency","Image_URL","Gallery_URLs","Short_Description","Full_Description","Shopee_Link","TikTok_Link","Lazada_Link","Featured","Status","Badge","Rating","Reviews","Stock_Label","Sort_Order","Date_Added","AI_Title","AI_Description","AI_Hooks","AI_Caption","SEO_Title","SEO_Description","Keywords","UTM_Campaign"];
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function get(){let u=new URL(API_URL);u.searchParams.set("action","admin");return fetch(u).then(r=>r.json())}
async function post(x){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)}).then(r=>r.json())}
async function load(){try{d=await get();let s=d.stats||{};$("#stats").innerHTML=[["Products",s.products],["Clicks",s.clicks],["Content",s.content],["Published",s.published],["Scheduled",s.scheduled],["Shopee clicks",s.shopee]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]||0}</b></div>`).join("");tab("products")}catch(e){$("#main").innerHTML='<div class="empty"><b>Backend not connected.</b><br>Set your Apps Script Web App URL in admin.html.</div>'}}
function activate(t){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===t))}
function tab(t){activate(t);
if(t==="products"){$("#main").innerHTML=`<div class="toolbar"><input id="q" placeholder="Search products..." oninput="renderP()"><button class="btn light" onclick="load()">Refresh</button><button class="btn" onclick="openP()">+ Product</button></div><div class="scroll"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>AI</th><th>Links</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;renderP()}
if(t==="content"){$("#main").innerHTML=`<h2>Content Queue</h2><p class="muted">Draft, schedule and track promotional content without changing the existing Google Sheets workflow.</p><div class="notice">Statuses supported by the backend: Draft, Scheduled, Published.</div><div class="queue" style="margin-top:12px">${(d.content||[]).map(c=>`<div class="item"><div class="item-head"><b>${esc(c.Platform)} · ${esc(c.Content_Type)}</b><span class="pill">${esc(c.Status)}</span></div><div style="margin-top:6px">${esc(c.Caption)}</div><small class="muted">${c.Scheduled_At?esc(c.Scheduled_At):"No schedule set"}</small></div>`).join("")||'<div class="empty">No content yet.</div>'}</div>`}
if(t==="campaign"){$("#main").innerHTML=`<h2>Campaign Builder</h2><p class="muted">Apply one UTM campaign name to active products using the existing saveProduct backend action.</p><div style="display:flex;gap:8px;max-width:600px"><input id="cn" placeholder="Campaign name" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:10px"><button class="btn" onclick="applyCampaign()">Apply</button></div><div class="notice" style="margin-top:14px">Use the same campaign name in your social scheduler and affiliate network sub-ID/UTM fields where supported.</div>`}
if(t==="ai")$("#main").innerHTML=`<h2>AI Studio</h2><p class="muted">The existing AI-ready fields stay intact. This page does not expose or store private AI API keys.</p><div class="notice">Use a product's facts, then paste them into your preferred AI provider. Generated values can be stored in AI_Title, AI_Description, AI_Hooks, AI_Caption, SEO_Title, SEO_Description and Keywords.</div><h3>Prompt template</h3><pre>Create compliant promotional content for this affiliate product.
Return:
1. SEO title
2. Short description
3. Three hooks
4. Facebook caption
5. TikTok caption
6. Instagram caption
7. Five keywords

Do not claim facts not provided. Keep the tone helpful, concise and Philippine-market friendly.</pre>`;
}
function renderP(){let q=($("#q")?.value||"").toLowerCase();$("#rows").innerHTML=(d.products||[]).filter(p=>(`${p.Product_Name||""} ${p.Product_ID||""} ${p.Category||""}`).toLowerCase().includes(q)).map(p=>`<tr><td><div class="product-cell"><img class="thumb" src="${esc(p.Image_URL||"https://via.placeholder.com/80")}"><div><b>${esc(p.Product_Name)}</b><br><small class="muted">${esc(p.Product_ID)}</small></div></div></td><td>${esc(p.Category)}</td><td>${esc(p.Currency||"₱")}${Number(p.Price||0).toLocaleString()}</td><td>${p.AI_Title?'<span class="pill ok">Ready</span>':'<span class="pill">—</span>'}</td><td>${p.Shopee_Link?"S ":""}${p.TikTok_Link?"T ":""}${p.Lazada_Link?"L":""}</td><td>${esc(p.Status||"")}</td><td><button class="btn" onclick='edit(${JSON.stringify(p)})'>Edit</button></td></tr>`).join("")||'<tr><td colspan="7" class="empty">No products found.</td></tr>'}
function openP(p={}){$("#mt").textContent=p.Product_ID?"Edit Product":"Add Product";$("#form").innerHTML=fields.map(f=>`<label class="${["Full_Description","AI_Description","AI_Hooks","AI_Caption","SEO_Description","Keywords"].includes(f)?"full":""}">${f}<input id="f_${f}" value="${esc(p[f])}"></label>`).join("");$("#modal").style.display="flex"}
function edit(p){openP(p)} function closeM(){$("#modal").style.display="none"}
async function saveP(){let p={};fields.forEach(f=>p[f]=$("#f_"+f).value);if(!p.Status)p.Status="active";if(!p.Currency)p.Currency="₱";let r=await post({action:"saveProduct",product:p});if(r.ok){closeM();load()}else alert(r.error||"Save failed")}
async function applyCampaign(){let c=$("#cn").value.trim();if(!c)return alert("Enter campaign name.");for(let p of (d.products||[]).filter(x=>String(x.Status).toLowerCase()!=="inactive")){p.UTM_Campaign=c;await post({action:"saveProduct",product:p})}alert("Campaign applied.");load()}
load();
</script>
</body>
</html>
