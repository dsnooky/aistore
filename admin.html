<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Command Center V4</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#171923;font-family:system-ui,-apple-system,Segoe UI,Arial}.wrap{max-width:1280px;margin:auto;padding:18px}header{display:flex;gap:8px;align-items:center;margin-bottom:14px}.brand{font-weight:900;font-size:22px;margin-right:auto}button{border:0;border-radius:9px;padding:10px 13px;background:#111827;color:#fff;cursor:pointer}.light{background:#fff;color:#111827;border:1px solid #ddd}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px}.stat{padding:14px}.stat b{display:block;font-size:24px;margin-top:4px}.panel{padding:17px;margin-top:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{padding:10px;border:1px solid #ddd;border-radius:9px;min-width:220px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px 7px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.box{background:#fff;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:17px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{font-size:11px;color:#666}.form input,.form textarea,.form select{display:block;width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-top:4px}.full{grid-column:1/-1}.notice{padding:11px;background:#f1f5f9;border-radius:9px;font-size:12px}.queue{display:grid;gap:8px}.item{padding:12px;border:1px solid #eee;border-radius:10px}.item b{display:block}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><header><div class="brand">Affiliate Command Center V4</div><a href="index.html"><button class="light">Store</button></a><button onclick="openP()">+ Product</button></header><div id="stats" class="cards"></div><section class="panel"><div class="tabs"><button onclick="tab('products')">Products</button><button class="light" onclick="tab('content')">Content Queue</button><button class="light" onclick="tab('campaign')">Campaigns</button><button class="light" onclick="tab('ai')">AI Studio</button></div><div id="main"></div></section></div>
<div class="modal" id="modal"><div class="box"><h2 id="mt">Product</h2><div id="form" class="form"></div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:14px"><button class="light" onclick="closeM()">Cancel</button><button onclick="saveP()">Save Product</button></div></div></div>
<script>
const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";let d={products:[],content:[]};const $=x=>document.querySelector(x);const fields=["Product_ID","Product_Name","Slug","Category","Price","Old_Price","Discount","Currency","Image_URL","Gallery_URLs","Short_Description","Full_Description","Shopee_Link","TikTok_Link","Lazada_Link","Featured","Status","Badge","Rating","Reviews","Stock_Label","Sort_Order","Date_Added","AI_Title","AI_Description","AI_Hooks","AI_Caption","SEO_Title","SEO_Description","Keywords","UTM_Campaign"];
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}async function get(){let u=new URL(API_URL);u.searchParams.set("action","admin");return fetch(u).then(r=>r.json())}async function post(x){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)}).then(r=>r.json())}async function load(){d=await get();let s=d.stats||{};$("#stats").innerHTML=[["Products",s.products],["Clicks",s.clicks],["Content",s.content],["Published",s.published],["Scheduled",s.scheduled],["Shopee",s.shopee]].map(x=>`<div class="stat">${x[0]}<b>${x[1]||0}</b></div>`).join("");tab("products")}
function tab(t){if(t==="products"){$("#main").innerHTML=`<div class="toolbar"><input id="q" placeholder="Search products..." oninput="renderP()"><button class="light" onclick="load()">Refresh</button></div><div class="scroll"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>AI</th><th>Links</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>`;renderP()}
if(t==="content"){$("#main").innerHTML=`<h3>Content Queue</h3><div class="notice">Prepare posts here after generating them with the AI Studio prompt. Statuses: Draft, Scheduled, Published.</div><div class="queue">${(d.content||[]).map(c=>`<div class="item"><b>${esc(c.Platform)} · ${esc(c.Content_Type)}</b>${esc(c.Caption)}<br><small>Status: ${esc(c.Status)} ${c.Scheduled_At?"· "+esc(c.Scheduled_At):""}</small></div>`).join("")||"<p>No content yet.</p>"}</div>`}
if(t==="campaign")$("#main").innerHTML=`<h3>Campaign Builder</h3><p><input id="cn" placeholder="Campaign name" style="padding:10px;width:100%;border:1px solid #ddd;border-radius:8px"></p><button onclick="applyCampaign()">Apply campaign to active products</button><div class="notice" style="margin-top:12px">Use the same campaign name in your social scheduling tool and affiliate UTM/sub-ID fields where supported.</div>`;
if(t==="ai")$("#main").innerHTML=`<h3>AI Studio</h3><div class="notice">Select a product, then use its product facts to generate platform-specific copy. This V4 build provides the workflow and storage; it does not silently call an AI provider without your API/connection.</div><p><button onclick="openP()">Open Product</button></p><h4>Prompt template</h4><pre style="white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:10px">Create compliant promotional content for this affiliate product. Return: 1 SEO title, 2 short description, 3 three hooks, 4 Facebook caption, 5 TikTok caption, 6 Instagram caption, 7 five keywords. Do not claim facts not provided. Keep the tone helpful, concise and Philippine-market friendly.</pre>`;
}
function renderP(){let q=($("#q")?.value||"").toLowerCase();$("#rows").innerHTML=d.products.filter(p=>(p.Product_Name||"").toLowerCase().includes(q)).map(p=>`<tr><td><b>${esc(p.Product_Name)}</b><br><small>${esc(p.Product_ID)}</small></td><td>${esc(p.Category)}</td><td>${esc(p.Currency||"₱")}${Number(p.Price||0).toLocaleString()}</td><td>${p.AI_Title?"✓":"—"}</td><td>${p.Shopee_Link?"S ":""}${p.TikTok_Link?"T ":""}${p.Lazada_Link?"L":""}</td><td><button onclick='edit(${JSON.stringify(p)})'>Edit</button></td></tr>`).join("")}
function openP(p={}){$("#mt").textContent=p.Product_ID?"Edit Product":"Add Product";$("#form").innerHTML=fields.map(f=>`<label>${f}<input id="f_${f}" value="${esc(p[f])}"></label>`).join("");$("#modal").style.display="flex"}function edit(p){openP(p)}function closeM(){$("#modal").style.display="none"}
async function saveP(){let p={};fields.forEach(f=>p[f]=$("#f_"+f).value);if(!p.Status)p.Status="active";if(!p.Currency)p.Currency="₱";let r=await post({action:"saveProduct",product:p});if(r.ok){closeM();load()}else alert(r.error)}
async function applyCampaign(){let c=$("#cn").value;if(!c)return alert("Enter campaign name.");for(let p of d.products.filter(x=>String(x.Status).toLowerCase()!=="inactive")){p.UTM_Campaign=c;await post({action:"saveProduct",product:p})}alert("Campaign applied.");load()}
load();
</script></body></html>
