<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyFinds PH</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fa;color:#171923;font-family:system-ui,-apple-system,Segoe UI,Arial}.wrap{max-width:1180px;margin:auto;padding:0 16px}header{position:sticky;top:0;z-index:5;background:#ffffffef;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb}.nav{height:64px;display:flex;align-items:center;gap:12px}.logo{font-weight:900;font-size:21px;margin-right:auto}.search{width:min(430px,50vw);padding:10px 13px;border:1px solid #ddd;border-radius:11px}.hero{margin:20px 0;padding:42px 28px;border-radius:24px;background:linear-gradient(135deg,#111827,#4b5563);color:#fff}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1;margin:0 0 10px}.hero p{color:#d9dce2}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.chip{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px}.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;overflow:hidden}.pic{aspect-ratio:1;background:#f0f1f4}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.name{font-weight:800;min-height:42px}.price{font-size:21px;font-weight:900;margin-top:7px}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:5px}.badge{display:inline-block;background:#eef2ff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800;margin-bottom:6px}.rating{font-size:12px;color:#9a6700;margin-top:5px}.buttons{display:flex;gap:6px;margin-top:12px}.btn{flex:1;border:0;border-radius:9px;padding:9px 5px;background:#111827;color:#fff;font-weight:700;font-size:11px}.alt{background:#eef0f3;color:#111827}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.search{width:42vw}.hero{padding:28px 20px}.buttons{flex-direction:column}}
</style></head><body><header><div class="wrap nav"><div class="logo" id="logo">MyFinds PH</div><input class="search" id="q" placeholder="Search products..."><a href="admin.html" style="font-size:12px;color:#777">Admin</a></div></header><main class="wrap"><section class="hero"><h1 id="ht">Find it. Compare it. Shop it.</h1><p id="hs">Curated affiliate finds from Shopee, TikTok Shop and Lazada.</p></section><div class="chips" id="chips"></div><div class="grid" id="grid"></div></main>
<script>
const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";let d={},cat="All";const $=x=>document.querySelector(x);function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){let u=new URL(API_URL);u.searchParams.set("action","store");d=await fetch(u).then(r=>r.json());let s=d.settings||{};if(s.STORE_NAME)$("#logo").textContent=s.STORE_NAME;if(s.HERO_TITLE)$("#ht").textContent=s.HERO_TITLE;if(s.HERO_SUBTITLE)$("#hs").textContent=s.HERO_SUBTITLE;renderChips();render()}
function go(p,platform,url){fetch(API_URL,{method:"POST",body:JSON.stringify({action:"track",product_id:p.Product_ID,product_name:p.Product_Name,platform,url,referrer:document.referrer,device:/Mobi/i.test(navigator.userAgent)?"Mobile":"Desktop",campaign:p.UTM_Campaign||""})}).catch(()=>{});location.href=url}
function renderChips(){let cs=["All",...(d.categories||[]).map(x=>x.Category_Name)];$("#chips").innerHTML=cs.map(x=>`<button class="chip ${x===cat?"active":""}" onclick="cat=${JSON.stringify(x)};renderChips();render()">${esc(x)}</button>`).join("")}
function render(){let q=$("#q").value.toLowerCase(),ps=(d.products||[]).filter(p=>(cat==="All"||p.Category===cat)&&(`${p.Product_Name} ${p.Category} ${p.Short_Description}`.toLowerCase().includes(q)));$("#grid").innerHTML=ps.map(p=>`<article class="card"><div class="pic"><img src="${esc(p.Image_URL||"https://via.placeholder.com/600x600?text=Product")}"></div><div class="body">${p.Badge?`<span class="badge">${esc(p.Badge)}</span>`:""}<div class="name">${esc(p.AI_Title||p.Product_Name)}</div><div class="rating">${p.Rating?"★ "+esc(p.Rating):""}${p.Reviews?" · "+esc(p.Reviews)+" reviews":""}</div><div class="price">${esc(p.Currency||"₱")}${Number(p.Price||0).toLocaleString()}${p.Old_Price?`<span class="old">${esc(p.Currency||"₱")}${Number(p.Old_Price).toLocaleString()}</span>`:""}</div><div class="buttons">${p.Shopee_Link?`<button class="btn" onclick='go(${JSON.stringify(p)},"Shopee",${JSON.stringify(p.Shopee_Link)})'>Shopee</button>`:""}${p.TikTok_Link?`<button class="btn" onclick='go(${JSON.stringify(p)},"TikTok Shop",${JSON.stringify(p.TikTok_Link)})'>TikTok</button>`:""}${p.Lazada_Link?`<button class="btn alt" onclick='go(${JSON.stringify(p)},"Lazada",${JSON.stringify(p.Lazada_Link)})'>Lazada</button>`:""}</div></div></article>`).join("")||"<p>No products found.</p>"}$("#q").oninput=render;load();
</script></body></html>
